<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODOS ✦</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="app">
  <div class="header">
    <h1>MY TODOS ✦</h1>
    <p>stay organized, stay colorful</p>
  </div>

  <div class="stats">
    <div class="stat-pill active">Active: <span id="count-active">0</span></div>
    <div class="stat-pill done">Done: <span id="count-done">0</span></div>
    <div class="stat-pill">Total: <span id="count-total">0</span></div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="todo-input" placeholder="What needs to be done?" maxlength="120">
      <div class="color-picker" id="color-picker"></div>
    </div>
    <button id="add-btn">+ ADD</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>

  <div id="todo-list"></div>
  <div class="empty-state" id="empty-state">
    <div class="empty-emoji">🎉</div>
    <p>Nothing here. Add something!</p>
  </div>

  <button class="clear-btn" id="clear-btn">Clear completed</button>
</div>

<script src="script.js"></script>
</body>
</html>
